
name: Run tests

on:
  push:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/run-tests.yaml'

permissions:
  contents: read

jobs:
  build-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test project
        run: >
          ./gradlew
          test
