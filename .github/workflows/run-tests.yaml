
name: Run tests

on:
  push:
    paths-ignore:
      - README.md

jobs:
  build-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:

      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test project
        run: >
          ./gradlew
          test
