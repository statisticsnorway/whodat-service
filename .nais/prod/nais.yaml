# Deploy config for the test cluster
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: whodat-service
  namespace: "{{ team }}"
  labels:
    team: "{{ team }}"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "6G"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "420"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "420"
    nginx.ingress.kubernetes.io/keepalive: "480"
    nginx.ingress.kubernetes.io/keepalive-timeout: "390"
spec:
  image: "{{ image }}" # Injected from the GitHub Action
  port: 9191
  terminationGracePeriodSeconds: 180s

  ingresses:
    - https://whodat-service.intern.ssb.no

  accessPolicy:
    outbound:
      external:
        - host: auth.ssb.no
        - host: guardian.intern.ssb.no
        - host: "secretmanager.googleapis.com"
        - host: "www.googleapis.com"
        - host: "cloudidentity.googleapis.com"
        - host: "labid.lab.dapla-external.ssb.no"
        - host: "folkeregisteret.api.skatteetaten.no"

  env:
    - name: MICRONAUT_CONFIG_FILES
      value: /conf/protected/app-roles.yml
    - name: MICRONAUT_ENVIRONMENTS
      value: naisprod

  envFrom:
    - secret: whodat

  filesFrom:
    - configmap: whodat-roles-prod-configmap
      mountPath: /conf/protected

  replicas:
    min: 2
    max: 2
  resources:
    requests:
      cpu: 400m
      memory: 1000Mi
    limits:
      memory: 1500Mi

  prometheus:
    enabled: true
    path: /prometheus
    port: "11100"

  liveness:
    path: /health/liveness
    port: 11100
    timeout: 5 # seconds
    initialDelay: 45 # seconds
  readiness:
    path: /health/readiness
    port: 11100
    timeout: 5 # seconds
    initialDelay: 45 # seconds
  startup:
    path: /health/liveness
    port: 11100
