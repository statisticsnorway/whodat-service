# Deploy config for the test cluster
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: whodat-service
  namespace: {{team}}
  labels:
    team: {{team}}
spec:
  image: "{{ image }}"  # Injected from the GitHub Action
  port: 9191

  ingresses:
    - https://whodat-service.intern.ssb.no

  accessPolicy:
    outbound:
      external:
        - host: auth.ssb.no
        - host: guardian.intern.ssb.no
        - host: "secretmanager.googleapis.com"
        - host: "www.googleapis.com"
        - host: "cloudidentity.googleapis.com"
        - host: "labid.lab.dapla-external.ssb.no"
        - host: "folkeregisteret.api.skatteetaten.no"

  env:
    - name: MICRONAUT_ENVIRONMENTS
      value: naisprod

  envFrom:
    - secret: whodat

  replicas:
    min: 2
    max: 2
  resources:
    requests:
      cpu: 400m
      memory: 1000Mi
    limits:
      memory: 1500Mi

  prometheus:
    enabled: true
    path: /prometheus
    port: "9191"

  liveness:
    path: /health/liveness
    port: 9191
    timeout: 5
  readiness:
    path: /health/readiness
    port: 9191
    timeout: 5
  startup:
    path: /health/liveness
    port: 9191