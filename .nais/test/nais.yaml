# Deploy config for the test cluster
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: whodat-service
  namespace: {{team}}
  labels:
    team: {{team}}
spec:
  image: "{{ image }}"  # Injected from the GitHub Action
  port: 9191

  ingresses:
    - https://whodat-service.intern.test.ssb.no

  accessPolicy:
    outbound:
      external:
        - host: auth.test.ssb.no
        - host: guardian.intern.test.ssb.no
        - host: "secretmanager.googleapis.com"
        - host: "www.googleapis.com"
        - host: "cloudidentity.googleapis.com"
        - host: "labid.lab.dapla-test-external.ssb.no"
        - host: "labid.lab.dapla-dev-external.ssb.no"
        - host: "guardian.intern.test.ssb.no"

  env:
    - name: MICRONAUT_ENVIRONMENTS
      value: naistest
  
  envFrom:
    - secret: gcp-keycloak-clients-project-id
    - secret: whodat-mp-client-id

  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 20m
      memory: 400Mi

  prometheus:
    enabled: true
    path: /prometheus
    port: "9191"

  liveness:
    path: /health/liveness
    port: 9191
  readiness:
    path: /health/readiness
    port: 9191
  startup:
    path: /health/liveness
    port: 9191