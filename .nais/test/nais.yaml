# Deploy config for the test cluster
apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: whodat-service-develop
  namespace: {{team}}
  labels:
    team: {{team}}
spec:
  image: "{{ image }}"  # Injected from the GitHub Action
  port: 9191

  ingresses:
    - https://whodat-service-develop.intern.test.ssb.no

  accessPolicy:
    outbound:
      external:
        - host: auth.test.ssb.no
        - host: guardian.intern.test.ssb.no
        - host: "secretmanager.googleapis.com"
        - host: "www.googleapis.com"
        - host: "cloudidentity.googleapis.com"
        - host: "labid.lab.dapla-test-external.ssb.no"
        - host: "labid.lab.dapla-dev-external.ssb.no"
        - host: "guardian.intern.test.ssb.no"
        - host: "folkeregisteret-api-konsument.sits.no"

  env:
    - name: MICRONAUT_ENVIRONMENTS
      value: naistest
  
  envFrom:
    - secret: whodat

  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
    limits:
      memory: 1500Mi

  prometheus:
    enabled: true
    path: /prometheus
    port: "9191"

  liveness:
    path: /health/liveness
    port: 11100
    timeout: 5       # seconds
    initialDelay: 45 # seconds
  readiness:
    path: /health/readiness
    port: 11100
    timeout: 5       # seconds
    initialDelay: 45 # seconds
  startup:
    path: /health/liveness
    port: 9191
